name: Compact smart league UI

on:
  push:
    paths:
      - '.github/workflows/compact-smart-ui.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact and simplify scoreboard UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          # Simplify standings columns now that ranking is based on sets won.
          s=s.replace('1 point for every set won · Ranked by set points, then set difference','Ranked by sets won · set difference breaks ties')
          s=s.replace('<th>D</th>','')
          s=s.replace('<th>Set Pts</th>','')
          s=s.replace('<td>${x.d}</td>','')
          s=s.replace('<td class="pts">${x.pts}</td>','')
          s=s.replace('colspan="10"','colspan="8"')

          # Make leader copy about sets won instead of points.
          s=s.replace("${l.pts} set point${l.pts===1?'':'s'}","${l.sf} set${l.sf===1?'':'s'} won")
          s=s.replace('<div class="lp"><b>${l.pts}</b><span>Set Points</span></div>','<div class="lp"><b>${l.sf}</b><span>Sets Won</span></div>')

          marker='/* compact-smart-ui */'
          if marker not in s:
              css=r'''
/* compact-smart-ui */
body{background:#f7f8fa}
.hero{box-shadow:0 1px 0 rgba(10,50,45,.08)}
.hero-in{padding:14px 28px;min-height:78px}
.logo{width:46px;height:46px;border-radius:12px;font-size:25px;box-shadow:0 5px 14px #0001}
.brand{gap:12px}.brand h1{font-size:27px;letter-spacing:-.025em}.brand p{font-size:12px;margin-top:3px}.tagline{font-size:8px;letter-spacing:.22em;line-height:1.6}
.page{max-width:1320px;padding:13px 28px 24px}
.tabs{gap:6px;margin-bottom:12px}.tab{padding:8px 12px;border-radius:10px;font-size:12px;font-weight:800}.tab svg{width:16px;height:16px}
.stats{gap:9px;margin-bottom:12px}.stat{min-height:84px;padding:11px 13px;border-radius:11px;gap:11px;box-shadow:0 3px 14px rgba(15,50,57,.055)}
.sico{width:43px;height:43px}.sico svg{width:20px}.sl{font-size:11px}.sv{font-size:22px;margin-top:1px}.sn{font-size:10px;margin-top:3px}
.dash{grid-template-columns:minmax(0,2.25fr) minmax(290px,.9fr);gap:11px}.card{border-radius:11px;box-shadow:0 3px 14px rgba(15,50,57,.055)}
.chead{padding:11px 14px;gap:10px;min-height:58px}.ctitle{gap:9px}.ctitle svg{width:21px;height:21px}.ctitle h2{font-size:15px;letter-spacing:-.01em}.ctitle p{font-size:10.5px;margin-top:2px}.meta{font-size:10px}
table{min-width:650px}th,td{padding:9px 7px}th{font-size:9.5px;letter-spacing:.04em}.rank{width:29px;height:29px;font-size:12px}.teamcell{gap:9px}.avatar{width:33px;height:33px;font-size:12px}.tname{font-size:12.5px}.tcode{font-size:8.5px}.pts{font-size:14px}.status{padding:7px 14px 9px;font-size:10px}
.side{gap:10px}.latest{padding:9px}.box{padding:10px;border-radius:10px}.rowmeta{font-size:10px}.done{font-size:10px;margin:6px auto 9px;padding:4px 9px}.score{gap:7px}.scorename{font-size:12px}.bigscore{font-size:20px;padding:8px 10px}.sets{margin-top:8px}.set{padding:5px 7px;font-size:10px}
.leader{padding:11px;gap:9px}.lav{width:48px;height:48px;font-size:15px;border-width:3px;box-shadow:0 0 0 4px #fff8df}.lname{font-size:13px}.lrec{font-size:9.5px}.lp{padding:8px 10px;border-radius:9px}.lp b{font-size:21px}.lp span{font-size:9px}
.results{padding:11px;gap:9px}.result{padding:10px;border-radius:10px}.rscore{gap:8px;margin:9px 0}.rt{font-size:12px}.rb{font-size:19px;padding:7px 9px}.chip{font-size:9.5px;padding:5px 7px}
.review{padding:11px;gap:9px}.rv{padding:13px;border-radius:10px}.rv h3{font-size:13px}.rvbig{font-size:20px}.rvnote{font-size:10.5px}
.admin{padding:13px}.notice{padding:9px 11px;font-size:10.5px}.ft{font-size:12px;margin:13px 0 6px}input,select{min-height:38px;padding:8px 9px;font-size:12px}.act{padding:8px 11px;font-size:11px}.setsin{margin-top:5px}.mrow{padding:8px 0}
.footer{max-width:1320px;padding:0 28px 20px}.fleft{font-size:13px}.fright{font-size:8.5px}.credit{font-size:9.5px}
@media(max-width:740px){
  .hero-in{padding:12px 14px}.logo{width:40px;height:40px;font-size:22px}.brand h1{font-size:20px}.brand p{font-size:10px}
  .page{padding:10px 12px 18px}.tabs{margin-bottom:9px}.tab{padding:7px 9px;font-size:11px}
  .stats{grid-template-columns:1fr 1fr;gap:7px}.stat{min-height:68px;padding:9px 10px}.stat:nth-child(3){grid-column:1/-1}.sico{width:36px;height:36px}.sico svg{width:17px}.sv{font-size:18px}.sn{font-size:9px}
  .dash{grid-template-columns:1fr;gap:9px}.side{display:grid;grid-template-columns:1fr;gap:9px}.chead{padding:10px 12px}.ctitle h2{font-size:14px}.ctitle p{font-size:9.5px}
  table{min-width:590px}th,td{padding:8px 6px}.teamcell{min-width:170px}.footer{padding:0 12px 18px}
}
'''
              s=s.replace('</style></head>',css+'</style></head>')

          p.write_text(s)
          PY
      - name: Commit compact redesign
        run: |
          git config user.name "AGD Scoreboard Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Redesign scoreboard with compact smart league layout"
          git push

# trigger compact redesign
