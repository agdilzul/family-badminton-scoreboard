name: Compact smart league UI

on:
  push:
    paths:
      - '.github/workflows/compact-smart-ui.yml'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compact and simplify scoreboard UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('1 point for every set won · Ranked by set points, then set difference','Ranked by sets won · set difference breaks ties')
          s=s.replace('<th>D</th>','')
          s=s.replace('<th>Set Pts</th>','')
          s=s.replace('<td>${x.d}</td>','')
          s=s.replace('<td class="pts">${x.pts}</td>','')
          s=s.replace('colspan="10"','colspan="8"')
          s=s.replace("${l.pts} set point${l.pts===1?'':'s'}","${l.sf} set${l.sf===1?'':'s'} won")
          s=s.replace('<div class="lp"><b>${l.pts}</b><span>Set Points</span></div>','<div class="lp"><b>${l.sf}</b><span>Sets Won</span></div>')
          if '/* compact-smart-ui */' not in s:
              css=base64.b64decode('').decode()
              s=s.replace('</style></head>',css+'</style></head>')
          p.write_text(s)
          PY
      - name: Commit compact redesign
        run: |
          git config user.name "AGD Scoreboard Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Redesign scoreboard with compact smart league layout"
          git push

# valid trigger
