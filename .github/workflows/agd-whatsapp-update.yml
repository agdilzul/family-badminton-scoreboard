name: AGD WhatsApp contact update

on:
  push:
    paths:
      - '.github/workflows/agd-whatsapp-update.yml'

permissions:
  contents: write

jobs:
  update-contact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change phone contact to WhatsApp
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<a class="contact-link" href="tel:+6738804540"><i data-lucide="phone"></i><span>+673 8804540</span></a>'
          new = '<a class="contact-link" href="https://wa.me/6738804540" target="_blank" rel="noopener noreferrer"><i data-lucide="message-circle"></i><span>WhatsApp · +673 8804540</span></a>'
          if old not in s:
              raise SystemExit('Expected phone contact link not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit updated contact link
        run: |
          git config user.name "AGD Scoreboard Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "Make AGD contact number open WhatsApp"
          git push
